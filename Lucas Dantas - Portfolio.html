  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

p>Fluxo em <strong>etapas condicionais<\u002Fstrong>: cada resposta muda as perguntas seguintes.<\u002Fp>\n            <p><strong>Cálculo monetário<\u002Fstrong> e envio do resultado por e-mail via backend próprio.<\u002Fp>\n          <\u002Fdiv>\n          <div class=\"ld-proj-t\"><span class=\"ld-chip\">Next.js<\u002Fspan><span class=\"ld-chip\">TypeScript<\u002Fspan><span class=\"ld-chip\">Tailwind<\u002Fspan><span class=\"ld-chip\">Node.js<\u002Fspan><\u002Fdiv>\n          <a class=\"ld-proj-l\" href=\"https://acadbrasil.com.br/calculadora-acad-economia/\" target=\"_blank\" rel=\"noreferrer\">acadbrasil.com.br ↗<\u002Fa>\n        <\u002Fdiv>\n        <div class=\"ld-proj-img\"><img data-px=\"\" src=\"ebeac69d-8967-4992-aae2-1b128ee93bac\" alt=\"Calculadora ACAD Economia\" loading=\"lazy\" decoding=\"async\"><\u002Fdiv>\n      <\u002Farticle>\n\n      <article class=\"ld-proj\" style=\"min-height:92svh\">\n        <div class=\"ld-proj-txt\">\n          <p class=\"ld-proj-n\">Project 03<\u002Fp>\n          <h3 class=\"ld-proj-h\">Categorizador de E-mails com IA<\u002Fh3>\n          <p class=\"ld-proj-cat\" data-i18n=\"catSys\">Sistemas<\u002Fp>\n          <div class=\"ld-proj-d\" data-i18n-html=\"p3\">\n            <p>Classificador de e-mails para o <strong>setor financeiro<\u002Fstrong>: separa produtivos de improdutivos e sugere a resposta.<\u002Fp>\n            <p>IA via <strong>Google Gemini<\u002Fstrong>, com <strong>fallback por palavras-chave (NLTK)<\u002Fstrong> quando a API falha.<\u002Fp>\n            <p>Entrada por texto ou <strong>upload de TXT/PDF<\u002Fstrong>, em <strong>Flask<\u002Fstrong> com front em Tailwind.<\u002Fp>\n          <\u002Fdiv>\n          <div class=\"ld-proj-t\"><span class=\"ld-chip\">Python<\u002Fspan><span class=\"ld-chip\">Flask<\u002Fspan><span class=\"ld-chip\">Gemini API<\u002Fspan><span class=\"ld-chip\">NLTK<\u002Fspan><span class=\"ld-chip\">Tailwind<\u002Fspan><\u002Fdiv>\n          <a class=\"ld-proj-l\" href=\"https:// \n  <div id=\"ld-chat\" style=\"position:fixed;right:clamp(12px,2.5vw,32px);bottom:clamp(12px,2.5vw,32px);z-index:160;width:min(370px,calc(100vw - 24px));display:none;flex-direction:column;border:1px solid #1E1C19;background:#0A0908;box-shadow:0 30px 90px rgba(0,0,0,.6)\">\n    <div style=\"display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 15px;border-bottom:1px solid #1E1C19;background:#0F0E0C\">\n      <span style=\"font-family:'DM Mono',monospace;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#8A857D\" data-i18n=\"chatTitle\">fale com o assistente<\u002Fspan>\n      <span style=\"display:flex;gap:8px\">\n        <button id=\"ld-chat-reset\" style=\"cursor:pointer;border:0;background:transparent;color:#6E6861;font-family:'DM Mono',monospace;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase\" data-i18n=\"chatReset\">reiniciar<\u002Fbutton>\n        <button id=\"ld-chat-close\" style=\"cursor:pointer;border:0;background:transparent;color:#EDEAE5;font-family:'DM Mono',monospace;font-size:13px;padding:0 4px\">×<\u002Fbutton>\n      <\u002Fspan>\n    <\u002Fdiv>\n    <div id=\"ld-chat-log\" style=\"height:min(52vh,400px);overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:11px\"><\u002Fdiv>\n    <div id=\"ld-chat-foot\" style=\"border-top:1px solid #1E1C19;padding:12px 15px\"><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"ld-priv\" style=\"position:fixed;inset:0;z-index:190;display:none;background:rgba(7,6,5,.94);backdrop-filter:blur(8px);padding:clamp(16px,5vh,64px) clamp(16px,4vw,52px);overflow-y:auto\">\n    <div style=\"max-width:760px;margin:0 auto;border:1px solid #1E1C19;background:#0A0908;padding:clamp(24px,4vw,52px)\">\n      <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:18px;margin-bottom:22px\">\n        <h3 style=\"margin:0;font-size:clamp(22px,2.6vw,34px);font-weight:600;letter-spacing:-.025em\">Política de Privacidade<\u002Fh3>\n        <button id=\"ld-priv-close\" style=\"cursor:pointer;border:1px solid #1E1C19;background:transparent;color:#EDEAE5;padding:6px 12px;border-radius:2px;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase\">fechar<\u002Fbutton>\n      <\u002Fdiv>\n      <p style=\"margin:0 0 20px;font-family:'DM Mono',monospace;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#6E6861\">atualizado em julho/2026<\u002Fp>\n      <p style=\"margin:0 0 26px;font-size:14px;line-height:1.68;color:#8A857D;text-wrap:pretty\">Este site é o portfólio pessoal de Lucas Dantas. Levo a sua privacidade a sério e, em conformidade com a Lei Geral de Proteção de Dados (LGPD — Lei nº 13.709/2018), explico abaixo quais dados são tratados ao navegar por aqui.<\u002Fp>\n      <div style=\"display:flex;flex-direction:column;gap:24px\">\n        <div><h4 class=\"ld-pv-h\">1. Dados coletados<\u002Fh4><p class=\"ld-pv-p\">Este site não possui formulários de cadastro, login ou coleta direta de dados pessoais. Nenhum dado pessoal identificável é armazenado em servidores próprios.<\u002Fp><p class=\"ld-pv-p\">As preferências de tema (claro/escuro) e idioma são salvas apenas no seu navegador (localStorage) e nunca saem do seu dispositivo.<\u002Fp><p class=\"ld-pv-p\">O assistente de chat (chatbot) deste site é determinístico — uma máquina de estados finitos (FSM), sem IA/LLM — e roda inteiramente no seu navegador: o nome que você informa e o histórico da conversa ficam salvos apenas no seu localStorage, nunca são enviados a nenhum servidor, e são apagados automaticamente após 1 hora sem interação.<\u002Fp><\u002Fdiv>\n        <div><h4 class=\"ld-pv-h\">2. Cookies e serviços de terceiros<\u002Fh4><p class=\"ld-pv-p\">Google AdSense: este site pode exibir anúncios do Google AdSense, que utiliza cookies para personalização e medição de anúncios, conforme as políticas do Google. Você pode gerenciar a personalização de anúncios em adssettings.google.com.<\u002Fp><p class=\"ld-pv-p\">API do GitHub: a seção de estatísticas consulta a API pública do GitHub (api.github.com) para exibir dados públicos do perfil do autor. Nenhum dado seu é enviado nessa consulta.<\u002Fp><p class=\"ld-pv-p\">Fontes do Google (Google Fonts) são servidas de forma otimizada pelo próprio site via Next.js, sem requisições do seu navegador aos servidores do Google.<\u002Fp><\u002Fdiv>\n        <div><h4 class=\"ld-pv-h\">3. Seus direitos (LGPD)<\u002Fh4><p class=\"ld-pv-p\">Nos termos do art. 18 da LGPD, você tem direito a confirmação de tratamento, acesso, correção, anonimização, portabilidade e eliminação de dados pessoais, entre outros.<\u002Fp><p class=\"ld-pv-p\">Como este site não armazena dados pessoais em servidores próprios, o exercício desses direitos se aplica principalmente aos serviços de terceiros citados acima, diretamente junto a eles.<\u002Fp><\u002Fdiv>\n        <div><h4 class=\"ld-pv-h\">4. Contato<\u002Fh4><p class=\"ld-pv-p\">Para qualquer dúvida sobre privacidade ou solicitação relacionada a dados, entre em contato pelo LinkedIn: linkedin.com/in/lucas-de-sousa-dantas.<\u002Fp><\u002Fdiv>\n        <div><h4 class=\"ld-pv-h\">5. Alterações<\u002Fh4><p class=\"ld-pv-p\">Esta política pode ser atualizada a qualquer momento para refletir mudanças no site ou na legislação. A data da última atualização consta no topo deste documento.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#1D94E3&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#1D94E3&quot;,&quot;#D7A45A&quot;,&quot;#22C55E&quot;,&quot;#A78BFA&quot;],&quot;section&quot;:&quot;Identidade&quot;},&quot;particleCount&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:14000,&quot;min&quot;:3000,&quot;max&quot;:26000,&quot;step&quot;:1000,&quot;tsType&quot;:&quot u002Fstrong> with product dimensions.<\u002Fp><p>Custom <strong>PHP + MySQL<\u002Fstrong> backend: authentication, password recovery and transactional email.<\u002Fp><p>Partner signup and dashboard in <strong>React<\u002Fstrong>, on a maintainable architecture.<\u002Fp>\",\n  p2:\"<p>Savings calculator for gyms, with the design reproduced from <strong>Figma<\u002Fstrong>.<\u002Fp><p><strong>Conditional step flow<\u002Fstrong>: each answer changes the questions that follow.<\u002Fp><p><strong>Monetary calculation<\u002Fstrong> and result sent by email through a custom backend.<\u002Fp>\",\n  p3:\"<p>Email classifier for the <strong>financial sector<\u002Fstrong>: sorts productive from unproductive and drafts the reply.<\u002Fp><p>AI via <strong>Google Gemini<\u002Fstrong>, with a <strong>keyword fallback (NLTK)<\u002Fstrong> when the API fails.<\u002Fp><p>Text input or <strong>TXT/PDF upload<\u002Fstrong>, on <strong>Flask<\u002Fstrong> with a Tailwind front end.<\u002Fp>\",\n  p4:\"<p>Real estate portal for sales and rentals, which I have <strong>maintained and evolved for over a year<\u002Fstrong>.<\u002Fp><p><strong>Custom PHP plugin<\u002Fstrong>: Elementor widgets and catalog export as <strong>XML<\u002Fstrong> to partner portals.<\u002Fp><p>Search on <strong>JetEngine + JetSmartFilters<\u002Fstrong>, event tracking in <strong>GTM<\u002Fstrong> and chat for lead capture.<\u002Fp>\",\n  p5:\"<p><strong>Car battery<\u002Fstrong> e-commerce on WooCommerce: I built it, maintain it and handle the <strong>deploy<\u002Fstrong>.<\u002Fp><p><strong>Custom plugin<\u002Fstrong> for the client's custom fields and delivery methods.<\u002Fp><p>Conditional rules: each delivery option enables itself based on the <strong>product<\u002Fstrong> and the <strong>time of purchase<\u002Fstrong>.<\u002Fp>\",\n  p6:\"<p>Multi-page launch blog for a <strong>Spanish citizenship<\u002Fstrong> campaign.<\u002Fp><p>Dynamic lead routing in <strong>round-robin<\u002Fstrong>: each rep got an equal share of the volume.<\u002Fp><p>Campaign <strong>tracking<\u002Fstrong> plugins. Result: <strong>R$ 80k in one week<\u002Fstrong>.<\u002Fp>\",\n  p7:\"<p>Multi-page launch blog for a <strong>professional strength &amp; conditioning certification<\u002Fstrong> campaign.<\u002Fp><p><strong>R$ 100k in revenue in one week<\u002Fstrong>.<\u002Fp><p>The case earned an <strong>award for the campaign strategist<\u002Fstrong>.<\u002Fp>\",\n  p8:\"<p>Institutional and quoting site for an automotive company in <strong>New Zealand<\u002Fstrong>.<\u002Fp><p><strong>Pixel-perfect<\u002Fstrong> design, including cards with diagonal cutouts in <strong>custom SVG<\u002Fstrong>.<\u002Fp><p>Multi-step <strong>quote form<\u002Fstrong>: contact, vehicle, services and photo upload.<\u002Fp>\",\n};\nComponent.DICT.es.__html = {\n  p1:\"<p>Calcula el flete cruzando <strong>distancia (Google Maps API)<\u002Fstrong> con las dimensiones del producto.<\u002Fp><p>Backend propio en <strong>PHP + MySQL<\u002Fstrong>: autenticación, recuperación de contraseña y envío de correos.<\u002Fp><p>Registro y panel del socio en <strong>React<\u002Fstrong>, con una arquitectura fácil de mantener.<\u002Fp>\",\n  p2:\"<p>Calculadora de ahorro para gimnasios, con el diseño reproducido de <strong>Figma<\u002Fstrong>.<\u002Fp><p>Flujo por <strong>etapas condicionales<\u002Fstrong>: cada respuesta cambia las preguntas siguientes.<\u002Fp><p><strong>Cálculo monetario<\u002Fstrong> y envío del resultado por correo mediante un backend propio.<\u002Fp>\",\n  p3:\"<p>Clasificador de correos para el <strong>sector financiero<\u002Fstrong>: separa productivos de improductivos y sugiere la respuesta.<\u002Fp><p>IA vía <strong>Google Gemini<\u002Fstrong>, con <strong>fallback por palabras clave (NLTK)<\u002Fstrong> cuando la API falla.<\u002Fp><p>Entrada por texto o <strong>subida de TXT/PDF<\u002Fstrong>, en <strong>Flask<\u002Fstrong> con front en Tailwind.<\u002Fp>\",\n  p4:\"<p>Portal inmobiliario de compra y alquiler, que <strong>mantengo y evoluciono desde hace más de un año<\u002Fstrong>.<\u002Fp><p><strong>Plugin propio en PHP<\u002Fstrong>: widgets para Elementor y exportación del catálogo en <strong>XML<\u002Fstrong> a portales asociados.<\u002Fp><p>Búsqueda con <strong>JetEngine + JetSmartFilters<\u002Fstrong>, eventos en <strong>GTM<\u002Fstrong> y chat para captación de leads.<\u002Fp>\",\n  p5:\"<p>E-commerce de <strong>baterías automotrices<\u002Fstrong> en WooCommerce: lo desarrollé, lo mantengo y hago el <strong>deploy<\u002Fstrong>.<\u002Fp><p><strong>Plugin propio<\u002Fstrong> para campos personalizados y las modalidades de entrega del cliente.<\u002Fp><p>Reglas condicionales: cada entrega se habilita sola según el <strong>producto<\u002Fstrong> y el <strong>momento de la compra<\u002Fstrong>.<\u002Fp>\",\n  p6:\"<p>Blog de lanzamiento con varias páginas para una campaña de <strong>ciudadanía española<\u002Fstrong>.<\u002Fp><p>Envío dinámico de leads en <strong>round-robin<\u002Fstrong>: cada vendedor recibía una porción igual del volumen.<\u002Fp><p>Plugins de <strong>rastreo<\u002Fstrong> de la campaña. Resultado: <strong>R$ 80 mil en 1 semana<\u002Fstrong>.<\u002Fp>\",\n  p7:\"<p>Blog de lanzamiento con varias páginas para una campaña de <strong>certificación profesional en fuerza y acondicionamiento<\u002Fstrong>.<\u002Fp><p><strong>R$ 100 mil facturados en 1 semana<\u002Fstrong>.<\u002Fp><p>El case le valió un <strong>premio al estratega<\u002Fstrong> de la campaña.<\u002Fp>\",\n  p8:\"<p>Sitio institucional y de presupuestos para una empresa automotriz en <strong>Nueva Zelanda<\u002Fstrong>.<\u002Fp><p>Diseño <strong>pixel-perfect<\u002Fstrong>, con cards de recortes diagonales en <strong>SVG a medida<\u002Fstrong>.<\u002Fp><p><strong>Formulario de presupuesto<\u002Fstrong> por etapas: contacto, vehículo, servicios y subida de fotos.<\u002Fp>\",\n};\nComponent.DICT.fr.__html = {\n  p1:\"<p>Calcule la livraison en croisant <strong>distance (API Google Maps)<\u002Fstrong> et dimensions du produit.<\u002Fp><p>Backend maison en <strong>PHP + MySQL<\u002Fstrong> : authentification, récupération de mot de passe et e-mails.<\u002Fp><p>Inscription et tableau de bord partenaire en <strong>React<\u002Fstrong>, sur une architecture maintenable.<\u002Fp>\",\n  p2:\"<p>Calculateur d'économies pour salles de sport, maquette reproduite depuis <strong>Figma<\u002Fstrong>.<\u002Fp><p>Parcours en <strong>étapes conditionnelles<\u002Fstrong> : chaque réponse modifie les questions suivantes.<\u002Fp><p><strong>Calcul monétaire<\u002Fstrong> et envoi du résultat par e-mail via un backend maison.<\u002Fp>\",\n  p3:\"<p>Classificateur d'e-mails pour le <strong>secteur financier<\u002Fstrong> : trie les productifs des improductifs et propose la réponse.<\u002Fp><p>IA via <strong>Google Gemini<\u002Fstrong>, avec un <strong>repli par mots-clés (NLTK)<\u002Fstrong> quand l'API échoue.<\u002Fp><p>Saisie texte ou <strong>envoi de TXT/PDF<\u002Fstrong>, en <strong>Flask<\u002Fstrong> avec un front en Tailwind.<\u002Fp>\",\n  p4:\"<p>Portail immobilier de vente et location, que je <strong>maintiens et fais évoluer depuis plus d'un an<\u002Fstrong>.<\u002Fp><p><strong>Plugin PHP sur mesure<\u002Fstrong> : widgets Elementor et export du catalogue en <strong>XML<\u002Fstrong> vers des portails partenaires.<\u002Fp><p>Recherche via <strong>JetEngine + JetSmartFilters<\u002Fstrong>, événements dans <strong>GTM<\u002Fstrong> et chat pour la captation de leads.<\u002Fp>\",\n  p5:\"<p>E-commerce de <strong>batteries automobiles<\u002Fstrong> sous WooCommerce : développé, maintenu et <strong>déployé<\u002Fstrong> par mes soins.<\u002Fp><p><strong>Plugin sur mesure<\u002Fstrong> pour les champs personnalisés et les modes de livraison du client.<\u002Fp><p>Règles conditionnelles : chaque mode de livraison s'active selon le <strong>produit<\u002Fstrong> et le <strong>moment de l'achat<\u002Fstrong>.<\u002Fp>\",\n  p6:\"<p>Blog de lancement multi-pages pour une campagne de <strong>citoyenneté espagnole<\u002Fstrong>.<\u002Fp><p>Routage dynamique des leads en <strong>round-robin<\u002Fstrong> : chaque commercial recevait une part égale du volume.<\u002Fp><p>Plugins de <strong>tracking<\u002Fstrong> de la campagne. Résultat : <strong>80 000 R$ en 1 semaine<\u002Fstrong>.<\u002Fp>\",\n  p7:\"<p>Blog de lancement multi-pages pour une campagne de <strong>certification professionnelle en force et conditionnement<\u002Fstrong>.<\u002Fp><p><strong>100 000 R$ de chiffre d'affaires en 1 semaine<\u002Fstrong>.<\u002Fp><p>Le case a valu un <strong>prix au stratège<\u002Fstrong> de la campagne.<\u002Fp>\",\n  p8:\"<p>Site institutionnel et de devis pour une entreprise automobile en <strong>Nouvelle-Zélande<\u002Fstrong>.<\u002Fp><p>Design <strong>au pixel près<\u002Fstrong>, avec des cartes aux découpes diagonales en <strong>SVG sur mesure<\u002Fstrong>.<\u002Fp><p><strong>Formulaire de devis<\u002Fstrong> par étapes : contact, véhicule, services et envoi de photos.<\u002Fp>\",\n};<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
